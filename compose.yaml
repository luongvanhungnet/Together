services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: together
      POSTGRES_USER: together
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - together-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U together -d together"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  together-postgres:
